name: Production Multi-Tier Integration & Verification Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compliance_and_performance_audit:
    runs-on: ubuntu-latest
    steps:
    - name: Pull Source Code Repository Tree
      uses: actions/checkout@v3

    - name: Set Up Node.js Host Environment
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Assemble Workspace System Dependencies
      run: npm ci

    - name: Run Build Verification Audits
      run: |
        node -e "
        const fs = require('fs');
        if (!fs.existsSync('.env.local')) {
          console.log('Creating mock verification stencil properties...');
          fs.writeFileSync('.env.local', 'VITE_ARCGIS_API_KEY=CI_STATIC_STENCIL\n');
        }
        "
        npm run build

    - name: Run Headless Lighthouse Performance Assertions
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://localhost:3000/
        staticDistDir: ./dist
        configPath: ./.lighthouserc.json
        uploadOutputs: false

  package_and_deploy_containers:
    needs: compliance_and_performance_audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Pull Source Code Repository Tree
      uses: actions/checkout@v3

    - name: Set Up Virtual Docker Buildx Environment
      uses: docker/setup-buildx-action@v2

    - name: Authenticate Container Registry Credentials
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Secure Backend Image Cluster
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/grid-backend:latest
