# Global Cluster Deployment Reverse-Proxy Engine (nginx.conf)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # High-Density Brotli Compression Layer Configuration
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    upstream backend_nodes {
        server backend_api:5000;
    }

    upstream frontend_nodes {
        server frontend_client:3000;
    }

    server {
        listen 80;
        server_name gridguardian.network www.gridguardian.network;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name gridguardian.network www.gridguardian.network;

        ssl_certificate /etc/nginx/certs/live_chain.crt;
        ssl_certificate_key /etc/nginx/certs/private_key.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
